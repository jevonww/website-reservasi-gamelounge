<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="t">
  <title id="t">LEVELUP lounge interior</title>
  <defs>
    <radialGradient id="bg" cx="50%" cy="20%" r="90%">
      <stop offset="0%" stop-color="#191530"/>
      <stop offset="100%" stop-color="#05050a"/>
    </radialGradient>
    <linearGradient id="strip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9B7BFF"/>
      <stop offset="100%" stop-color="#5EE7FF"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#17132a"/>
      <stop offset="100%" stop-color="#07070c"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="34"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="10"/></filter>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <circle cx="240" cy="260" r="260" fill="#9B7BFF" opacity="0.2" filter="url(#glow)"/>
  <circle cx="960" cy="220" r="250" fill="#5EE7FF" opacity="0.14" filter="url(#glow)"/>
  <rect y="560" width="1200" height="240" fill="url(#floor)"/>
  <rect x="0" y="554" width="1200" height="4" fill="url(#strip)" opacity="0.55"/>
  <!-- back wall -->
  <rect x="0" y="0" width="1200" height="560" fill="#0a0913" opacity="0.35"/>
  <g fill="#1a1630" opacity="0.7">
    <rect x="60" y="0" width="30" height="560"/>
    <rect x="130" y="0" width="30" height="560"/>
    <rect x="1040" y="0" width="30" height="560"/>
    <rect x="1110" y="0" width="30" height="560"/>
  </g>
  <!-- stations across -->
  <g>
    <rect x="0" y="480" width="1200" height="26" rx="6" fill="#1e1934"/>
    <rect x="0" y="480" width="1200" height="2" fill="#4b4077" opacity="0.8"/>
    <!-- four glowing screens -->
    <g>
      <rect x="120" y="300" width="180" height="120" rx="8" fill="#05050b" stroke="#2e2748" stroke-width="2"/>
      <rect x="128" y="308" width="164" height="104" rx="5" fill="#7f6bff" opacity="0.55"/>
      <rect x="128" y="308" width="164" height="104" rx="5" fill="#06060c" opacity="0.4"/>
      <rect x="180" y="420" width="60" height="8" rx="4" fill="#0e0d18"/>
    </g>
    <g>
      <rect x="390" y="300" width="180" height="120" rx="8" fill="#05050b" stroke="#2e2748" stroke-width="2"/>
      <rect x="398" y="308" width="164" height="104" rx="5" fill="#5EE7FF" opacity="0.5"/>
      <rect x="398" y="308" width="164" height="104" rx="5" fill="#06060c" opacity="0.4"/>
      <rect x="450" y="420" width="60" height="8" rx="4" fill="#0e0d18"/>
    </g>
    <g>
      <rect x="660" y="300" width="180" height="120" rx="8" fill="#05050b" stroke="#2e2748" stroke-width="2"/>
      <rect x="668" y="308" width="164" height="104" rx="5" fill="#9B7BFF" opacity="0.6"/>
      <rect x="668" y="308" width="164" height="104" rx="5" fill="#06060c" opacity="0.4"/>
      <rect x="720" y="420" width="60" height="8" rx="4" fill="#0e0d18"/>
    </g>
    <g>
      <rect x="930" y="300" width="180" height="120" rx="8" fill="#05050b" stroke="#2e2748" stroke-width="2"/>
      <rect x="938" y="308" width="164" height="104" rx="5" fill="#6f7dff" opacity="0.55"/>
      <rect x="938" y="308" width="164" height="104" rx="5" fill="#06060c" opacity="0.4"/>
      <rect x="990" y="420" width="60" height="8" rx="4" fill="#0e0d18"/>
    </g>
  </g>
  <!-- chairs silhouettes -->
  <g fill="#0d0b16" opacity="0.95">
    <path d="M150 600 q70 -24 140 0 l14 70 q-84 22 -168 0 Z"/>
    <path d="M420 600 q70 -24 140 0 l14 70 q-84 22 -168 0 Z"/>
    <path d="M690 600 q70 -24 140 0 l14 70 q-84 22 -168 0 Z"/>
    <path d="M960 600 q70 -24 140 0 l14 70 q-84 22 -168 0 Z"/>
  </g>
  <!-- hanging lights -->
  <g>
    <rect x="290" y="0" width="2" height="120" fill="#2b2640"/>
    <ellipse cx="291" cy="124" rx="34" ry="10" fill="#191528" stroke="#3b3360" stroke-width="2"/>
    <ellipse cx="291" cy="140" rx="24" ry="26" fill="#9B7BFF" opacity="0.25" filter="url(#soft)"/>
    <rect x="900" y="0" width="2" height="100" fill="#2b2640"/>
    <ellipse cx="901" cy="104" rx="34" ry="10" fill="#191528" stroke="#3b3360" stroke-width="2"/>
    <ellipse cx="901" cy="120" rx="24" ry="26" fill="#5EE7FF" opacity="0.2" filter="url(#soft)"/>
  </g>
  <rect width="1200" height="800" fill="#05050a" opacity="0.08"/>
</svg>
