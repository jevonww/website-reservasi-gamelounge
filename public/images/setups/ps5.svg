<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="t">
  <title id="t">LEVELUP PS5 Station</title>
  <defs>
    <radialGradient id="bg" cx="50%" cy="20%" r="85%">
      <stop offset="0%" stop-color="#0f1a2a"/>
      <stop offset="100%" stop-color="#06060c"/>
    </radialGradient>
    <linearGradient id="tv" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5EE7FF"/>
      <stop offset="55%" stop-color="#6f8bff"/>
      <stop offset="100%" stop-color="#9B7BFF"/>
    </linearGradient>
    <linearGradient id="console" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f2f5ff"/>
      <stop offset="100%" stop-color="#b9c4de"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#12101f"/>
      <stop offset="100%" stop-color="#07070c"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="30"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="10"/></filter>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <circle cx="600" cy="260" r="330" fill="#5EE7FF" opacity="0.14" filter="url(#glow)"/>
  <circle cx="180" cy="420" r="200" fill="#9B7BFF" opacity="0.14" filter="url(#glow)"/>
  <!-- wall slats -->
  <g opacity="0.55" fill="#16202e">
    <rect x="40" y="80" width="18" height="460" rx="4"/>
    <rect x="78" y="80" width="18" height="460" rx="4"/>
    <rect x="1104" y="80" width="18" height="460" rx="4"/>
    <rect x="1142" y="80" width="18" height="460" rx="4"/>
  </g>
  <rect y="600" width="1200" height="200" fill="url(#floor)"/>
  <!-- TV -->
  <g>
    <rect x="280" y="120" width="640" height="380" rx="16" fill="#04040a" stroke="#26364a" stroke-width="4"/>
    <rect x="298" y="138" width="604" height="344" rx="8" fill="url(#tv)" opacity="0.82"/>
    <rect x="298" y="138" width="604" height="344" rx="8" fill="#06060c" opacity="0.42"/>
    <path d="M330 452 l160 -190 l120 110 l150 -140 l130 220 Z" fill="#080814" opacity="0.6"/>
    <circle cx="820" cy="200" r="22" fill="#fff" opacity="0.35"/>
    <circle cx="820" cy="200" r="46" fill="#fff" opacity="0.12" filter="url(#soft)"/>
    <rect x="560" y="500" width="80" height="10" rx="5" fill="#1b2636"/>
    <rect x="500" y="510" width="200" height="10" rx="5" fill="#243448"/>
  </g>
  <!-- console -->
  <g>
    <ellipse cx="180" cy="650" rx="150" ry="24" fill="#5EE7FF" opacity="0.12" filter="url(#soft)"/>
    <path d="M96 560 q0 -30 24 -30 h60 q22 0 22 30 v120 q0 22 -22 22 h-60 q-24 0 -24 -22 Z" fill="url(#console)"/>
    <path d="M118 548 q10 -48 34 -48 q22 0 22 48 Z" fill="#dbe3f5"/>
    <rect x="96" y="586" width="106" height="4" fill="#94a3c4" opacity="0.7"/>
    <rect x="150" y="600" width="8" height="46" rx="4" fill="#5EE7FF" opacity="0.8"/>
    <circle cx="126" cy="618" r="3" fill="#fff"/>
    <rect x="198" y="600" width="60" height="18" rx="9" fill="#1b2636"/>
  </g>
  <!-- controllers -->
  <g transform="translate(320 600)">
    <g transform="rotate(-12)">
      <path d="M18 26 q10 -22 40 -22 h36 q30 0 40 22 l18 52 q6 26 -18 30 q-22 4 -34 -14 l-8 -12 h-32 l-8 12 q-12 18 -34 14 q-24 -4 -18 -30 Z" fill="#eef2fb" stroke="#a9b6d0" stroke-width="2"/>
      <circle cx="52" cy="46" r="7" fill="#2b3a52"/>
      <circle cx="92" cy="40" r="7" fill="#2b3a52"/>
      <rect x="30" y="40" width="14" height="5" rx="2.5" fill="#2b3a52"/>
      <rect x="34.5" y="35.5" width="5" height="14" rx="2.5" fill="#2b3a52"/>
      <circle cx="70" cy="68" r="3" fill="#5EE7FF"/>
    </g>
  </g>
  <g transform="translate(790 610) rotate(14)">
    <path d="M18 26 q10 -22 40 -22 h36 q30 0 40 22 l18 52 q6 26 -18 30 q-22 4 -34 -14 l-8 -12 h-32 l-8 12 q-12 18 -34 14 q-24 -4 -18 -30 Z" fill="#e4e9f6" stroke="#a9b6d0" stroke-width="2"/>
    <circle cx="52" cy="46" r="7" fill="#2b3a52"/>
    <circle cx="92" cy="40" r="7" fill="#2b3a52"/>
    <rect x="30" y="40" width="14" height="5" rx="2.5" fill="#2b3a52"/>
    <rect x="34.5" y="35.5" width="5" height="14" rx="2.5" fill="#2b3a52"/>
    <circle cx="70" cy="68" r="3" fill="#9B7BFF"/>
  </g>
  <!-- sofa hint -->
  <g opacity="0.9">
    <rect x="960" y="470" width="220" height="130" rx="24" fill="#14112a" stroke="#2a2547" stroke-width="3"/>
    <rect x="978" y="500" width="184" height="60" rx="16" fill="#1c1836"/>
    <rect x="978" y="548" width="184" height="18" rx="8" fill="#241f42"/>
  </g>
  <rect width="1200" height="800" fill="#05050a" opacity="0.1"/>
</svg>
