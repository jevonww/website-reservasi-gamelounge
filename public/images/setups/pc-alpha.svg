<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="t">
  <title id="t">LEVELUP PC Alpha station</title>
  <defs>
    <radialGradient id="bg" cx="50%" cy="25%" r="80%">
      <stop offset="0%" stop-color="#1a1530"/>
      <stop offset="100%" stop-color="#07070d"/>
    </radialGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9B7BFF"/>
      <stop offset="60%" stop-color="#6f7dff"/>
      <stop offset="100%" stop-color="#5EE7FF"/>
    </linearGradient>
    <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e1a32"/>
      <stop offset="100%" stop-color="#0d0b16"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="24"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="8"/></filter>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <circle cx="300" cy="220" r="260" fill="#9B7BFF" opacity="0.16" filter="url(#glow)"/>
  <circle cx="940" cy="300" r="220" fill="#5EE7FF" opacity="0.1" filter="url(#glow)"/>
  <g opacity="0.45" stroke="#3b3360" stroke-width="2">
    <path d="M0 160 H1200 M0 320 H1200 M0 480 H1200" stroke-opacity="0.18"/>
    <path d="M160 0 V520 M400 0 V520 M800 0 V520 M1040 0 V520" stroke-opacity="0.12"/>
  </g>
  <!-- desk -->
  <rect x="60" y="560" width="1080" height="34" rx="8" fill="url(#desk)"/>
  <rect x="60" y="560" width="1080" height="2" fill="#4b4077" opacity="0.8"/>
  <ellipse cx="600" cy="640" rx="420" ry="70" fill="#9B7BFF" opacity="0.14" filter="url(#glow)"/>
  <!-- monitor -->
  <g>
    <rect x="330" y="200" width="540" height="320" rx="18" fill="#05050b" stroke="#332b54" stroke-width="4"/>
    <rect x="348" y="218" width="504" height="284" rx="10" fill="url(#screen)" opacity="0.9"/>
    <rect x="348" y="218" width="504" height="284" rx="10" fill="#08080f" opacity="0.25"/>
    <path d="M370 460 l120 -140 l90 76 l110 -110 l110 174 Z" fill="#0a0a16" opacity="0.55"/>
    <circle cx="790" cy="270" r="22" fill="#5EE7FF" opacity="0.85"/>
    <circle cx="790" cy="270" r="44" fill="#5EE7FF" opacity="0.22" filter="url(#soft)"/>
    <rect x="570" y="520" width="60" height="36" rx="6" fill="#211c38"/>
    <rect x="500" y="552" width="200" height="12" rx="6" fill="#2a2444"/>
  </g>
  <!-- keyboard -->
  <rect x="420" y="590" width="360" height="22" rx="7" fill="#0e0d18"/>
  <rect x="432" y="594" width="336" height="5" rx="2.5" fill="#9B7BFF" opacity="0.55"/>
  <rect x="560" y="620" width="80" height="10" rx="5" fill="#211c38"/>
  <!-- mouse -->
  <rect x="820" y="592" width="34" height="52" rx="16" fill="#171328" stroke="#2e2748" stroke-width="2"/>
  <rect x="835" y="600" width="4" height="14" rx="2" fill="#5EE7FF" opacity="0.7"/>
  <!-- tower -->
  <g>
    <rect x="930" y="330" width="120" height="240" rx="12" fill="#0a0913" stroke="#2a2444" stroke-width="3"/>
    <rect x="946" y="350" width="88" height="200" rx="6" fill="#0d0c18"/>
    <circle cx="990" cy="410" r="16" fill="#9B7BFF" opacity="0.9"/>
    <circle cx="990" cy="410" r="30" fill="#9B7BFF" opacity="0.35" filter="url(#soft)"/>
    <rect x="960" y="470" width="60" height="4" rx="2" fill="#5EE7FF" opacity="0.7"/>
    <rect x="960" y="484" width="60" height="4" rx="2" fill="#9B7BFF" opacity="0.6"/>
    <rect x="960" y="498" width="60" height="4" rx="2" fill="#5EE7FF" opacity="0.4"/>
  </g>
  <!-- headset -->
  <g>
    <path d="M195 480 a60 60 0 0 1 120 0" fill="none" stroke="#2b2445" stroke-width="12"/>
    <rect x="180" y="470" width="30" height="56" rx="12" fill="#1a1630" stroke="#332b54" stroke-width="2"/>
    <rect x="300" y="470" width="30" height="56" rx="12" fill="#1a1630" stroke="#332b54" stroke-width="2"/>
    <rect x="186" y="486" width="8" height="22" rx="4" fill="#5EE7FF" opacity="0.4"/>
  </g>
  <!-- chair silhouette -->
  <g opacity="0.85">
    <path d="M470 680 q130 -40 260 0 l20 90 q-150 30 -300 0 Z" fill="#0d0b16"/>
    <rect x="560" y="760" width="80" height="12" rx="6" fill="#171328"/>
  </g>
  <rect width="1200" height="800" fill="url(#bg)" opacity="0.08"/>
</svg>
