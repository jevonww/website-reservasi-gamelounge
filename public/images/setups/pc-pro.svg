<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="t">
  <title id="t">LEVELUP PC Pro dual monitor station</title>
  <defs>
    <radialGradient id="bg" cx="55%" cy="20%" r="85%">
      <stop offset="0%" stop-color="#191535"/>
      <stop offset="100%" stop-color="#06060c"/>
    </radialGradient>
    <linearGradient id="screenA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7f6bff"/>
      <stop offset="100%" stop-color="#5EE7FF"/>
    </linearGradient>
    <linearGradient id="screenB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b39dff"/>
      <stop offset="100%" stop-color="#9B7BFF"/>
    </linearGradient>
    <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#221d3a"/>
      <stop offset="100%" stop-color="#0d0b16"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="28"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="10"/></filter>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <circle cx="600" cy="180" r="320" fill="#9B7BFF" opacity="0.2" filter="url(#glow)"/>
  <circle cx="1020" cy="380" r="200" fill="#5EE7FF" opacity="0.12" filter="url(#glow)"/>
  <g opacity="0.5">
    <rect x="0" y="120" width="1200" height="2" fill="#3b3360" opacity="0.3"/>
    <rect x="100" y="0" width="2" height="560" fill="#3b3360" opacity="0.2"/>
    <rect x="1100" y="0" width="2" height="560" fill="#3b3360" opacity="0.2"/>
  </g>
  <!-- desk -->
  <rect x="40" y="570" width="1120" height="36" rx="8" fill="url(#desk)"/>
  <rect x="40" y="570" width="1120" height="2" fill="#54488a" opacity="0.9"/>
  <ellipse cx="610" cy="650" rx="440" ry="72" fill="#9B7BFF" opacity="0.18" filter="url(#glow)"/>
  <!-- ultrawide main -->
  <g>
    <rect x="250" y="180" width="700" height="340" rx="18" fill="#05050b" stroke="#3a315f" stroke-width="4"/>
    <rect x="268" y="198" width="664" height="304" rx="10" fill="url(#screenA)" opacity="0.92"/>
    <rect x="268" y="198" width="664" height="304" rx="10" fill="#08080f" opacity="0.3"/>
    <path d="M300 470 l150 -170 l110 96 l140 -130 l130 204 Z" fill="#0a0a16" opacity="0.55"/>
    <circle cx="840" cy="256" r="18" fill="#5EE7FF" opacity="0.9"/>
    <circle cx="840" cy="256" r="38" fill="#5EE7FF" opacity="0.25" filter="url(#soft)"/>
    <rect x="574" y="520" width="52" height="40" rx="6" fill="#241f3e"/>
    <rect x="470" y="554" width="260" height="14" rx="7" fill="#2f2850"/>
    <rect x="470" y="554" width="260" height="3" rx="1.5" fill="#5EE7FF" opacity="0.5"/>
  </g>
  <!-- side monitor -->
  <g opacity="0.92">
    <rect x="975" y="290" width="150" height="230" rx="12" fill="#05050b" stroke="#332b54" stroke-width="3"/>
    <rect x="986" y="302" width="128" height="206" rx="6" fill="url(#screenB)" opacity="0.7"/>
    <rect x="986" y="302" width="128" height="206" rx="6" fill="#08080f" opacity="0.45"/>
    <rect x="1010" y="518" width="80" height="34" fill="#1b1730"/>
    <rect x="990" y="522" width="120" height="8" rx="4" fill="#2a2444"/>
  </g>
  <!-- keyboard & mouse -->
  <rect x="380" y="596" width="400" height="24" rx="8" fill="#0e0d18"/>
  <rect x="394" y="600" width="372" height="6" rx="3" fill="#9B7BFF" opacity="0.7"/>
  <rect x="560" y="630" width="90" height="10" rx="5" fill="#211c38"/>
  <rect x="828" y="596" width="36" height="56" rx="17" fill="#171328" stroke="#2e2748" stroke-width="2"/>
  <rect x="844" y="604" width="4" height="16" rx="2" fill="#5EE7FF" opacity="0.8"/>
  <!-- tower with RGB -->
  <g>
    <rect x="940" y="360" width="130" height="260" rx="14" fill="#0a0913" stroke="#2f2850" stroke-width="3"/>
    <rect x="956" y="382" width="98" height="218" rx="8" fill="#0d0c18"/>
    <circle cx="1005" cy="446" r="20" fill="#9B7BFF" opacity="0.9"/>
    <circle cx="1005" cy="446" r="38" fill="#9B7BFF" opacity="0.35" filter="url(#soft)"/>
    <rect x="972" y="512" width="66" height="4" rx="2" fill="#5EE7FF" opacity="0.7"/>
    <rect x="972" y="526" width="66" height="4" rx="2" fill="#9B7BFF" opacity="0.6"/>
    <rect x="972" y="540" width="66" height="4" rx="2" fill="#5EE7FF" opacity="0.4"/>
  </g>
  <!-- microphone -->
  <g opacity="0.9">
    <rect x="120" y="430" width="8" height="160" rx="4" fill="#2a2444"/>
    <rect x="88" y="560" width="72" height="14" rx="7" fill="#171328"/>
    <rect x="100" y="392" width="48" height="70" rx="24" fill="#151226" stroke="#3a315f" stroke-width="2"/>
    <rect x="112" y="404" width="24" height="46" rx="12" fill="#9B7BFF" opacity="0.5"/>
  </g>
  <!-- chair -->
  <g opacity="0.9">
    <path d="M460 690 q140 -44 280 0 l22 78 q-162 32 -324 0 Z" fill="#0d0b16"/>
    <rect x="558" y="764" width="84" height="12" rx="6" fill="#171328"/>
  </g>
</svg>
