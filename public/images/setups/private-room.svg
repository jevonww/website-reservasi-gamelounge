<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="t">
  <title id="t">LEVELUP Private Room</title>
  <defs>
    <radialGradient id="bg" cx="50%" cy="25%" r="85%">
      <stop offset="0%" stop-color="#1c1533"/>
      <stop offset="100%" stop-color="#06060c"/>
    </radialGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9B7BFF"/>
      <stop offset="55%" stop-color="#6f7dff"/>
      <stop offset="100%" stop-color="#5EE7FF"/>
    </linearGradient>
    <linearGradient id="sofa" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2350"/>
      <stop offset="100%" stop-color="#171330"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="32"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="12"/></filter>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <circle cx="600" cy="240" r="340" fill="#9B7BFF" opacity="0.18" filter="url(#glow)"/>
  <circle cx="980" cy="420" r="240" fill="#5EE7FF" opacity="0.12" filter="url(#glow)"/>
  <!-- ceiling light strips -->
  <g opacity="0.8">
    <rect x="180" y="40" width="840" height="6" rx="3" fill="#9B7BFF" opacity="0.55"/>
    <rect x="180" y="40" width="840" height="20" fill="#9B7BFF" opacity="0.12" filter="url(#soft)"/>
    <rect x="300" y="80" width="600" height="3" rx="1.5" fill="#5EE7FF" opacity="0.35"/>
  </g>
  <!-- wall panels -->
  <g opacity="0.5" stroke="#3b3360">
    <path d="M80 120 V520 M220 120 V520 M340 120 V520 M860 120 V520 M980 120 V520 M1120 120 V520" stroke-opacity="0.3"/>
    <path d="M80 240 H1120" stroke-opacity="0.18"/>
  </g>
  <!-- big screen -->
  <g>
    <rect x="330" y="140" width="540" height="300" rx="14" fill="#04040a" stroke="#362d5c" stroke-width="4"/>
    <rect x="348" y="158" width="504" height="264" rx="8" fill="url(#screen)" opacity="0.85"/>
    <rect x="348" y="158" width="504" height="264" rx="8" fill="#06060c" opacity="0.35"/>
    <path d="M370 400 l130 -150 l100 86 l120 -110 l110 174 Z" fill="#080814" opacity="0.55"/>
    <circle cx="790" cy="210" r="18" fill="#fff" opacity="0.3"/>
  </g>
  <!-- multi PC desks left -->
  <g>
    <rect x="40" y="470" width="250" height="20" rx="6" fill="#221d3a"/>
    <rect x="60" y="360" width="90" height="80" rx="6" fill="#05050b" stroke="#2e2748" stroke-width="2"/>
    <rect x="68" y="368" width="74" height="64" rx="4" fill="url(#screen)" opacity="0.6"/>
    <rect x="170" y="360" width="90" height="80" rx="6" fill="#05050b" stroke="#2e2748" stroke-width="2"/>
    <rect x="178" y="368" width="74" height="64" rx="4" fill="url(#screen)" opacity="0.5"/>
    <rect x="70" y="440" width="60" height="8" rx="3" fill="#0e0d18"/>
    <rect x="180" y="440" width="60" height="8" rx="3" fill="#0e0d18"/>
  </g>
  <!-- multi PC desks right -->
  <g>
    <rect x="910" y="470" width="250" height="20" rx="6" fill="#221d3a"/>
    <rect x="930" y="360" width="90" height="80" rx="6" fill="#05050b" stroke="#2e2748" stroke-width="2"/>
    <rect x="938" y="368" width="74" height="64" rx="4" fill="url(#screen)" opacity="0.55"/>
    <rect x="1040" y="360" width="90" height="80" rx="6" fill="#05050b" stroke="#2e2748" stroke-width="2"/>
    <rect x="1048" y="368" width="74" height="64" rx="4" fill="url(#screen)" opacity="0.65"/>
    <rect x="940" y="440" width="60" height="8" rx="3" fill="#0e0d18"/>
    <rect x="1050" y="440" width="60" height="8" rx="3" fill="#0e0d18"/>
  </g>
  <!-- sofa center -->
  <g>
    <rect x="360" y="560" width="480" height="130" rx="30" fill="url(#sofa)" stroke="#3a3163" stroke-width="3"/>
    <rect x="392" y="586" width="190" height="66" rx="20" fill="#221d40"/>
    <rect x="618" y="586" width="190" height="66" rx="20" fill="#221d40"/>
    <rect x="392" y="640" width="416" height="22" rx="11" fill="#2b2450"/>
    <rect x="500" y="536" width="200" height="36" rx="14" fill="#1e1938"/>
    <ellipse cx="600" cy="700" rx="300" ry="40" fill="#9B7BFF" opacity="0.16" filter="url(#glow)"/>
  </g>
  <!-- coffee table -->
  <g>
    <rect x="470" y="690" width="260" height="16" rx="8" fill="#2a2450"/>
    <rect x="500" y="706" width="14" height="30" rx="4" fill="#1a1630"/>
    <rect x="686" y="706" width="14" height="30" rx="4" fill="#1a1630"/>
    <rect x="520" y="676" width="28" height="14" rx="4" fill="#5EE7FF" opacity="0.5"/>
    <rect x="650" y="676" width="28" height="14" rx="4" fill="#9B7BFF" opacity="0.5"/>
  </g>
</svg>
